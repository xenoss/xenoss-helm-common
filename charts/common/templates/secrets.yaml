{{- $root := . -}}
{{- $secretMaps := merge (dict) .Values.secretMaps .Values.global.secretMaps }}
{{- range $name, $secret := $secretMaps -}}
{{- if $secret.enabled }}

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ if eq $name "default" }}{{ include "common.fullname" $ }}{{ else }}{{ $name }}{{ end }}
  {{- if $secret.namespace }}
  namespace: {{ $secret.namespace }}
  {{- else }}
  namespace: {{ include "common.namespace" $root | quote }}
  {{- end }}
  labels: {{- include "common.labels" $root | nindent 4 }}
    {{- if or $secret.labels $root.Values.global.commonLabels }}
    {{ $labels := merge (dict) $secret.labels $root.Values.global.commonLabels }}
    {{- tpl ( $labels | toYaml ) $ | nindent 4 }}
    {{- end }}
  {{- if or $secret.annotation $.Values.commonAnnotations $.Values.global.commonAnnotations }}
    {{ $annotations := merge (dict) $secret.annotation $.Values.commonAnnotations $.Values.global.commonAnnotations }}
  annotations:
    {{- tpl ( $annotations | toYaml ) $ | nindent 4 }}
  {{- end }}
type: Opaque
data:
{{- range $key, $value := $secret.values }}
  {{ $key }}: {{ tpl $value $ | b64enc | quote }}
{{- end }}

{{- end }}
{{- end -}}
